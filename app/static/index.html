<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narudžba – demo</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --text: #1f1d1a; --muted: #6b665e; --line: #e4e0d7;
    --accent: #b8462e; --guest: #1f1d1a; --guest-text: #ffffff; --bot: #efebe3;
    --warn-bg: #fff4d6; --warn: #7a5a00; --bad-bg: #fde8e4; --bad: #9a2f1b; --ok: #2f6b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --panel: #1f1e1b; --text: #ece8e1; --muted: #a39d93; --line: #34312c;
      --accent: #e0745a; --guest: #ece8e1; --guest-text: #161513; --bot: #2a2824;
      --warn-bg: #3a3120; --warn: #f0cf7a; --bad-bg: #3d231d; --bad: #f2a493; --ok: #8fd19b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .status { font-size: 13px; color: var(--muted); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 8px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 16px 20px; max-width: 1100px; margin: 0 auto; height: calc(100vh - 62px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } }
  .chat, .order { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 300px; }
  .msg { max-width: 80%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; }
  .msg.guest { align-self: flex-end; background: var(--guest); color: var(--guest-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg .tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 99px; margin: 4px 4px 0 0; }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.ok { background: transparent; color: var(--ok); border: 1px solid currentColor; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input { flex: 1; font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
  .examples button { font-size: 13px; padding: 4px 10px; border-radius: 99px; color: var(--muted); }
  .order h2 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .order ul { list-style: none; margin: 0; padding: 8px 16px; flex: 1; overflow-y: auto; }
  .order li { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .order li .qty { color: var(--muted); font-variant-numeric: tabular-nums; }
  .order .empty { color: var(--muted); padding: 14px 0; border: 0; }
  .order .total { display: flex; justify-content: space-between; padding: 14px 16px; border-top: 1px solid var(--line); font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>Telefonska narudžba – demo</h1>
  <span class="status" id="status"></span>
  <button id="reset" type="button">Nova narudžba</button>
</header>
<main>
  <section class="chat">
    <div class="messages" id="messages" aria-live="polite"></div>
    <div class="examples" id="examples"></div>
    <form id="form">
      <input id="text" autocomplete="off" placeholder="Npr. dvije margarite i jednu colu" maxlength="1000" required>
      <button class="primary" id="send">Pošalji</button>
    </form>
  </section>
  <aside class="order">
    <h2>Narudžba</h2>
    <ul id="items"><li class="empty">Još ništa nije naručeno.</li></ul>
    <div class="total"><span>Ukupno</span><span id="total">0,00 €</span></div>
  </aside>
</main>
<script>
const EXAMPLES = [
  "dvije margarite i jednu colu",
  "i još dva piva",
  "ipak bez cole",
  "imate li nešto bez mesa?",
  "jedan hamburger",
  "jednu pizzu",
];
const $ = (id) => document.getElementById(id);
const euro = (n) => n.toFixed(2).replace(".", ",") + " €";
let sessionId = null;

function addMessage(kind, text, tags = []) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;
  for (const [cls, label] of tags) {
    const span = document.createElement("span");
    span.className = "tag " + cls;
    span.textContent = label;
    div.appendChild(document.createElement("br"));
    div.appendChild(span);
  }
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function renderOrder(items, total) {
  const ul = $("items");
  ul.replaceChildren();
  if (!items.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "Još ništa nije naručeno.";
    ul.appendChild(li);
  }
  for (const item of items) {
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.innerHTML = `<span class="qty">${item.quantity}×</span> `;
    name.append(item.name);
    const price = document.createElement("span");
    price.textContent = euro(item.line_total_eur);
    li.append(name, price);
    ul.appendChild(li);
  }
  $("total").textContent = euro(total);
}

// Turns the structured response into what the assistant would say back.
function describe(body) {
  const tags = [];
  for (const u of body.unavailable) tags.push(["bad", `Nemamo: ${u.text} (${u.quantity}×)`]);
  for (const u of body.unclear) tags.push(["warn", `Nejasno: ${u.text}`]);
  if (body.degraded) tags.push(["warn", "Rezervni način rada (model nedostupan)"]);

  let text;
  if (body.suggestions.length) {
    text = "Možemo ponuditi: " + body.suggestions.map((s) => `${s.name} (${euro(s.price_eur)})`).join(", ") + ".";
  } else if (body.clarification) {
    text = body.clarification;
  } else if (body.intent === "order" && body.items.length) {
    text = (body.unavailable.length ? "" : "U redu. ") + "Trenutno imate: "
      + body.items.map((i) => `${i.quantity}× ${i.name}`).join(", ") + `. Ukupno ${euro(body.total_eur)}.`;
  } else if (body.intent === "order") {
    text = "Narudžba je trenutno prazna.";
  } else {
    text = "Izvolite, što biste željeli naručiti?";
  }
  if (body.unavailable.length && !body.clarification && !body.suggestions.length) {
    const names = body.unavailable.map((u) => u.text).join(", ");
    text = `Nažalost, ${names} nemamo na jelovniku. ` + text;
  }
  return [text, tags];
}

async function send(text) {
  addMessage("guest", text);
  $("send").disabled = true;
  $("status").textContent = "Razmišljam…";
  try {
    const res = await fetch("/conversation", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, session_id: sessionId }),
    });
    const body = await res.json();
    if (!res.ok) {
      if (res.status === 404) sessionId = null;
      const detail = typeof body.detail === "string" ? body.detail : "Neispravan unos.";
      addMessage("bot", "Greška: " + detail, [["bad", "HTTP " + res.status]]);
      return;
    }
    sessionId = body.session_id;
    const [reply, tags] = describe(body);
    addMessage("bot", reply, tags);
    renderOrder(body.items, body.total_eur);
  } catch (err) {
    addMessage("bot", "Server nije dostupan.", [["bad", String(err)]]);
  } finally {
    $("send").disabled = false;
    $("status").textContent = sessionId ? `Razgovor ${sessionId.slice(0, 6)}` : "";
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  send(text);
});

$("reset").addEventListener("click", async () => {
  if (sessionId) fetch(`/conversation/${sessionId}`, { method: "DELETE" }).catch(() => {});
  sessionId = null;
  $("messages").replaceChildren();
  renderOrder([], 0);
  $("status").textContent = "";
  addMessage("bot", "Dobar dan! Što biste željeli naručiti?");
});

for (const example of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = example;
  b.addEventListener("click", () => send(example));
  $("examples").appendChild(b);
}
addMessage("bot", "Dobar dan! Što biste željeli naručiti?");
</script>
</body>
</html>
